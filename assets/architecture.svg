<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" font-family="monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c"/>
    </marker>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="920" height="500" fill="#020617"/>
  <rect width="920" height="500" fill="url(#grid)"/>

  <!-- title -->
  <circle cx="40" cy="32" r="4" fill="#34d399">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="56" y="37" fill="#f1f5f9" font-size="15" font-weight="bold">memnc mesh</text>
  <text x="880" y="37" fill="#64748b" font-size="10" text-anchor="end">local-first multi-agent orchestration</text>

  <!-- arrows behind boxes: NATS to orchestrator -->
  <line x1="330" y1="150" x2="330" y2="230" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="360" y1="230" x2="360" y2="150" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- NATS to workers -->
  <line x1="255" y1="150" x2="165" y2="330" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="460" y1="150" x2="460" y2="330" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="665" y1="150" x2="755" y2="330" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- telegram observer -->
  <line x1="700" y1="110" x2="845" y2="110" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr)"/>

  <!-- NATS bus -->
  <rect x="240" y="70" width="440" height="80" rx="6" fill="#0f172a" stroke="none"/>
  <rect x="240" y="70" width="440" height="80" rx="6" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="460" y="100" fill="#fdba74" font-size="13" font-weight="bold" text-anchor="middle">NATS  ·  JetStream + KV</text>
  <text x="460" y="122" fill="#94a3b8" font-size="10" text-anchor="middle">subjects · durable ledger · roster · request/reply</text>

  <!-- orchestrator -->
  <rect x="255" y="230" width="180" height="70" rx="6" fill="#0f172a" stroke="none"/>
  <rect x="255" y="230" width="180" height="70" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="345" y="258" fill="#6ee7b7" font-size="12" font-weight="bold" text-anchor="middle">Orchestrator</text>
  <text x="345" y="276" fill="#94a3b8" font-size="9" text-anchor="middle">FSM · durable snapshots</text>
  <text x="345" y="290" fill="#94a3b8" font-size="9" text-anchor="middle">claim gate · spectator</text>

  <!-- meshctl -->
  <rect x="20" y="70" width="150" height="80" rx="6" fill="#0f172a" stroke="none"/>
  <rect x="20" y="70" width="150" height="80" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="95" y="102" fill="#cbd5e1" font-size="12" font-weight="bold" text-anchor="middle">meshctl CLI</text>
  <text x="95" y="122" fill="#94a3b8" font-size="9" text-anchor="middle">submit · tail · roster</text>
  <text x="95" y="136" fill="#94a3b8" font-size="9" text-anchor="middle">ledger · grants</text>
  <line x1="170" y1="110" x2="240" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrS)"/>

  <!-- telegram observer -->
  <rect x="640" y="75" width="120" height="70" rx="6" fill="#0f172a" stroke="none"/>
  <rect x="640" y="75" width="120" height="70" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="700" y="102" fill="#fda4af" font-size="11" font-weight="bold" text-anchor="middle">Telegram</text>
  <text x="700" y="120" fill="#94a3b8" font-size="9" text-anchor="middle">read-only observer</text>
  <text x="900" y="100" fill="#64748b" font-size="9" text-anchor="end">phone</text>

  <!-- worker region -->
  <rect x="60" y="300" width="800" height="160" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="8,4" rx="12"/>
  <text x="80" y="325" fill="#fbbf24" font-size="10">worker nodes — each with local MCP tools + local inference</text>

  <!-- worker 1 -->
  <rect x="80" y="335" width="170" height="100" rx="6" fill="#0f172a" stroke="none"/>
  <rect x="80" y="335" width="170" height="100" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="165" y="358" fill="#67e8f9" font-size="11" font-weight="bold" text-anchor="middle">planner worker</text>
  <text x="165" y="376" fill="#94a3b8" font-size="9" text-anchor="middle">MCP: fs + shell</text>
  <text x="165" y="392" fill="#94a3b8" font-size="9" text-anchor="middle">Ollama (local)</text>
  <text x="165" y="408" fill="#94a3b8" font-size="9" text-anchor="middle">vram/gpu aware</text>
  <text x="165" y="424" fill="#64748b" font-size="8" text-anchor="middle">NODE_A</text>

  <!-- worker 2 -->
  <rect x="375" y="335" width="170" height="100" rx="6" fill="#0f172a" stroke="none"/>
  <rect x="375" y="335" width="170" height="100" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="460" y="358" fill="#67e8f9" font-size="11" font-weight="bold" text-anchor="middle">coder worker</text>
  <text x="460" y="376" fill="#94a3b8" font-size="9" text-anchor="middle">MCP: fs + shell</text>
  <text x="460" y="392" fill="#94a3b8" font-size="9" text-anchor="middle">Ollama (local)</text>
  <text x="460" y="408" fill="#94a3b8" font-size="9" text-anchor="middle">executes claims</text>
  <text x="460" y="424" fill="#64748b" font-size="8" text-anchor="middle">NODE_A / NODE_B</text>

  <!-- worker 3 -->
  <rect x="670" y="335" width="170" height="100" rx="6" fill="#0f172a" stroke="none"/>
  <rect x="670" y="335" width="170" height="100" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="755" y="358" fill="#67e8f9" font-size="11" font-weight="bold" text-anchor="middle">critic worker</text>
  <text x="755" y="376" fill="#94a3b8" font-size="9" text-anchor="middle">MCP: fs + shell</text>
  <text x="755" y="392" fill="#94a3b8" font-size="9" text-anchor="middle">Ollama (local)</text>
  <text x="755" y="408" fill="#94a3b8" font-size="9" text-anchor="middle">scores + gates</text>
  <text x="755" y="424" fill="#64748b" font-size="8" text-anchor="middle">NODE_B</text>

  <!-- legend -->
  <text x="80" y="483" fill="#fb923c" font-size="9">&#8594; mesh.task.* / mesh.agent.*</text>
  <text x="360" y="483" fill="#fb7185" font-size="9">- - read-only events</text>
  <text x="560" y="483" fill="#64748b" font-size="9">&#8594; control plane</text>
</svg>
