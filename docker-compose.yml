name: memnc

# Shared by every service. Inference endpoints are external to this stack.
x-mesh-env: &mesh-env
  NATS_URL: ${NATS_URL:-nats://nats:4222}
  NATS_TOKEN: ${NATS_TOKEN:?NATS_TOKEN must be set (e.g. in .env) — a shared token IS the mesh auth, never ship a default}
  # H4: per-node NKey seed (path to file on the mounted ./secrets volume).
  # When set it REPLACES the token as transport identity; the bus fails
  # closed if the file is missing. Example: /secrets/node-b.nk
  NATS_NKEYS_SEED: ${NATS_NKEYS_SEED:-}
  WORKSPACE_ROOT: /workspace
  INFERENCE_PROVIDER: ${INFERENCE_PROVIDER:-ollama}
  INFERENCE_BASE_URL: ${INFERENCE_BASE_URL:-http://host.docker.internal:11434}
  INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
  INFERENCE_TIMEOUT_S: ${INFERENCE_TIMEOUT_S:-180}
  INFERENCE_MAX_RETRIES: ${INFERENCE_MAX_RETRIES:-3}
  INFERENCE_FALLBACK_PROVIDER: ${INFERENCE_FALLBACK_PROVIDER:-}
  INFERENCE_FALLBACK_BASE_URL: ${INFERENCE_FALLBACK_BASE_URL:-}
  INFERENCE_FALLBACK_API_KEY: ${INFERENCE_FALLBACK_API_KEY:-}
  INFERENCE_FALLBACK_MODEL_MAP: ${INFERENCE_FALLBACK_MODEL_MAP:-}
  NUM_CTX: ${NUM_CTX:-8192}
  NUM_PREDICT: ${NUM_PREDICT:-4096}
  MAX_REVISIONS: ${MAX_REVISIONS:-3}
  MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
  MAX_TOOL_STEPS: ${MAX_TOOL_STEPS:-12}
  PLANNER_TIMEOUT_S: ${PLANNER_TIMEOUT_S:-180}
  CODER_TIMEOUT_S: ${CODER_TIMEOUT_S:-600}
  CRITIC_TIMEOUT_S: ${CRITIC_TIMEOUT_S:-180}
  ORCHESTRATOR_GRACE_S: ${ORCHESTRATOR_GRACE_S:-30}
  # Ship-gate V2 (docs/design-ship-gate.md): mechanical deliverable checks.
  # 0 = off. Recommended on the orchestrator side: VERIFY_MIN_LINES=20.
  VERIFY_MIN_LINES: ${VERIFY_MIN_LINES:-0}
  VERIFY_MIN_FILES: ${VERIFY_MIN_FILES:-0}
  MCP_ENABLED: ${MCP_ENABLED:-true}
  ALLOW_SHELL: ${ALLOW_SHELL:-true}
  SHELL_TIMEOUT_S: ${SHELL_TIMEOUT_S:-120}
  MAX_OUTPUT_BYTES: ${MAX_OUTPUT_BYTES:-65536}
  APPLY_ARTIFACTS: ${APPLY_ARTIFACTS:-true}
  # M9 capability gate: enable for multi-node deployments; the orchestrator
  # auto-grants agents whose node matches MESH_GRANT_NODES (glob patterns).
  MESH_GATE: ${MESH_GATE:-false}
  MESH_GRANT_NODES: ${MESH_GRANT_NODES:-}
  # M11: ledger-based self-claiming of claimable tasks (worker-side CAS)
  MESH_CLAIM: ${MESH_CLAIM:-false}
  # T6: node capabilities advertised into the roster KV by every worker.
  NODE_VRAM_GB: ${NODE_VRAM_GB:-0}
  NODE_GPU: ${NODE_GPU:-}
  # T7: pull whitelist. Empty list = pull path closed (matches the code default
  # in config.py — secure by default). Patterns are fnmatch against ollama
  # model tags. Enable explicitly in .env, e.g.:
  #   MODEL_PULL_WHITELIST=["llama3.2:3b","llama3.1:8b","qwen2.5:7b","qwen2.5-coder:7b","gemma*"]
  MODEL_PULL_WHITELIST: ${MODEL_PULL_WHITELIST:-[]}
  # 15.3 item 5: experience store. Default off = no deposits written;
  # enable in .env (EXPERIENCE_FROM_OBSERVATIONS=1). The store file path is
  # relative to the orchestrator workdir (persist it with a volume in .env
  # deployments that want durable experience).
  EXPERIENCE_FROM_OBSERVATIONS: ${EXPERIENCE_FROM_OBSERVATIONS:-0}
  EXPERIENCE_STORE_PATH: ${EXPERIENCE_STORE_PATH:-data/experience-store.json}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-mesh-service: &mesh-service
  build:
    context: .
    dockerfile: docker/worker.Dockerfile
  image: memnc:latest
  restart: unless-stopped
  # Match the host user so the ./workspace bind mount is writable.
  user: "${UID:-1000}:${GID:-1000}"
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  volumes:
    - ./workspace:/workspace
    # T0 quick-win: experience store lives under /app/data (relative
    # EXPERIENCE_STORE_PATH) — bind rw, containers are read_only otherwise.
    - ./data:/app/data
    # H4: per-node NKey seeds (secrets/<node>.nk, mode 0600, never committed).
    # Each service mounts only its own seed, see the service blocks below.
    # 15.4.1: per-node opencode provider config. Read-only on purpose, and
    # NOT mounted at the path opencode uses: 1.19 writes a .gitignore next to
    # its config on startup, so a read-only config dir aborts every run. The
    # harness copies opencode.json into the tmpfs and points the child there
    # (OPENCODE_CONFIG_SOURCE). Nodes without the dir get an empty one —
    # harmless, the harness only runs when a task asks for it.
    - ${HOME:-/root}/.config/opencode:/opt/opencode-config:ro
    # Cross-node ops (node-c/180) need an ssh client + the host's keys;
    # HOME=/tmp inside the worker, so ~/.ssh is /tmp/.ssh.
    - ${HOME:-/root}/.ssh:/tmp/.ssh:ro
    # The model index lives on the host. Read-only on purpose: a 7B coder
    # rewrote the whole file with a stub when this was writable. Tasks propose
    # their section in /workspace; the human applies it.
    - ${HOME:-/root}/ai_models:/workspace/ai_models:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    # H4: NKey mode (NATS_CONF set) uses per-node identities from
    # secrets/nats.conf; token mode keeps the H3 shared-token guard.
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        # Fail closed before any branch: every start needs NKey or token auth,
        # including cluster members (their route block adds no client auth).
        if [ -z "$$NATS_CONF" ] && [ -z "$$NATS_TOKEN" ]; then
          echo "FATAL: neither NATS_CONF (NKey mode) nor NATS_TOKEN (token mode) is set" >&2
          exit 1
        fi
        # Topology template: NATS_CLUSTER_ROUTES (comma-separated list of
        # "nats://host:6222" route URLs, own address included) turns this
        # server into a Raft cluster member. Solo deployments leave it
        # unset. The generated config keeps the base file (NKey mode uses
        # /cfg/nats.conf) and appends the cluster block.
        if [ -n "$$NATS_CLUSTER_ROUTES" ]; then
          BASE=/tmp/nats-base.conf
          if [ -n "$$NATS_CONF" ]; then cp /cfg/nats.conf "$$BASE"; else : > "$$BASE"; fi
          {
            echo ""
            echo "cluster {"
            echo "  name $${NATS_CLUSTER_NAME:-memnc}"
            echo "  port 6222"
            echo "  routes [ $${NATS_CLUSTER_ROUTES} ]"
            echo "}"
          } >> "$$BASE"
          if [ -n "$$NATS_TOKEN" ]; then
            exec nats-server -js -sd /data --http_port 8222 --config "$$BASE" --auth "$$NATS_TOKEN"
          fi
          exec nats-server -js -sd /data --http_port 8222 --config "$$BASE"
        fi
        if [ -n "$$NATS_CONF" ]; then
          exec nats-server -js -sd /data --http_port 8222 --config /cfg/nats.conf
        fi
        exec nats-server -js -sd /data --http_port 8222 --auth "$$NATS_TOKEN"
    environment:
      NATS_CONF: ${NATS_CONF:-}
      NATS_TOKEN: ${NATS_TOKEN:-}
      NATS_CLUSTER_ROUTES: ${NATS_CLUSTER_ROUTES:-}
      NATS_CLUSTER_NAME: ${NATS_CLUSTER_NAME:-memnc}
    ports:
      - "4222:4222"
      - "6222:6222"            # cluster routes (topology: mesh)
      - "127.0.0.1:8222:8222"  # monitoring: loopback only, no auth on :8222
    volumes:
      - nats-data:/data
      - ./secrets:/cfg:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -qO- http://127.0.0.1:8222/healthz >/dev/null || exit 1"
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  orchestrator:
    <<: *mesh-service
    command: ["python", "-m", "memnc.orchestrator"]
    environment:
      <<: *mesh-env
      NODE_NAME: orchestrator
      NATS_NKEYS_SEED: /secrets/orchestrator.nk
    volumes:
      - ./workspace:/workspace
      - ./data:/app/data
      - ${HOME:-/root}/.config/opencode:/opt/opencode-config:ro
      - ${HOME:-/root}/.ssh:/tmp/.ssh:ro
      - ${HOME:-/root}/ai_models:/workspace/ai_models:ro
      - ./secrets/orchestrator.nk:/secrets/orchestrator.nk:ro
    depends_on:
      nats:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256

  worker-planner:
    <<: *mesh-service
    command: ["python", "-m", "memnc.worker"]
    environment:
      <<: *mesh-env
      ROLE: planner
      NODE_NAME: ${NODE_NAME:-node-a}-planner
      NATS_NKEYS_SEED: /secrets/${NODE_NAME:-node-a}-planner.nk
      MODEL_PLANNER: ${MODEL_PLANNER:-qwen2.5:7b}
    volumes:
      - ./workspace:/workspace
      - ./data:/app/data
      - ${HOME:-/root}/.config/opencode:/opt/opencode-config:ro
      - ${HOME:-/root}/.ssh:/tmp/.ssh:ro
      - ${HOME:-/root}/ai_models:/workspace/ai_models:ro
      - ./secrets/${NODE_NAME:-node-a}-planner.nk:/secrets/${NODE_NAME:-node-a}-planner.nk:ro
    depends_on:
      nats:
        condition: service_healthy
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256

  worker-coder:
    <<: *mesh-service
    command: ["python", "-m", "memnc.worker"]
    environment:
      <<: *mesh-env
      ROLE: coder
      NODE_NAME: ${NODE_NAME:-node-a}-coder
      NATS_NKEYS_SEED: /secrets/${NODE_NAME:-node-a}-coder.nk
      MODEL_CODER: ${MODEL_CODER:-qwen2.5-coder:7b}
      HARNESS_CODER: ${HARNESS_CODER:-inproc}
    volumes:
      - ./workspace:/workspace
      - ./data:/app/data
      - ${HOME:-/root}/.config/opencode:/opt/opencode-config:ro
      - ${HOME:-/root}/.ssh:/tmp/.ssh:ro
      - ${HOME:-/root}/ai_models:/workspace/ai_models:ro
      - ./secrets/${NODE_NAME:-node-a}-coder.nk:/secrets/${NODE_NAME:-node-a}-coder.nk:ro
    depends_on:
      nats:
        condition: service_healthy
    mem_limit: 2g
    cpus: 4.0
    pids_limit: 512

  # Second coding lane: one model per GPU card. Both coders share the role
  # subject/durable (mesh.agent.coder.cmd), so tasks load-balance across the
  # two models instead of queueing behind one slow card.
  worker-coder-swift:
    <<: *mesh-service
    command: ["python", "-m", "memnc.worker"]
    environment:
      <<: *mesh-env
      ROLE: coder
      NODE_NAME: ${NODE_NAME:-node-a}-coder-swift
      NATS_NKEYS_SEED: /secrets/${NODE_NAME:-node-a}-coder-swift.nk
      MODEL_CODER: ${MODEL_CODER_SWIFT:-swift/swift-1.5}
      HARNESS_CODER: ${HARNESS_CODER:-inproc}
    volumes:
      - ./workspace:/workspace
      - ./data:/app/data
      - ${HOME:-/root}/.config/opencode:/opt/opencode-config:ro
      - ${HOME:-/root}/.ssh:/tmp/.ssh:ro
      - ${HOME:-/root}/ai_models:/workspace/ai_models:ro
      - ./secrets/${NODE_NAME:-node-a}-coder-swift.nk:/secrets/${NODE_NAME:-node-a}-coder-swift.nk:ro
    depends_on:
      nats:
        condition: service_healthy
    mem_limit: 2g
    cpus: 4.0
    pids_limit: 512

  worker-critic:
    <<: *mesh-service
    command: ["python", "-m", "memnc.worker"]
    environment:
      <<: *mesh-env
      ROLE: critic
      NODE_NAME: ${NODE_NAME:-node-a}-critic
      NATS_NKEYS_SEED: /secrets/${NODE_NAME:-node-a}-critic.nk
      # Critic rides the always-on llama.cpp HIP server (:8098, model fully
      # in VRAM) instead of Ollama — Gemma-4-31B Q4 (~20 GB) cannot fit a
      # 16 GiB card, Ollama CPU-falls-back to ~2 t/s. Nodes without :8098
      # override CRITIC_* in their .env.
      INFERENCE_PROVIDER: ${CRITIC_INFERENCE_PROVIDER:-openai}
      INFERENCE_BASE_URL: ${CRITIC_INFERENCE_BASE_URL:-http://host.docker.internal:8098}
      MODEL_CRITIC: ${CRITIC_MODEL:-gemma4-31b}
    volumes:
      - ./workspace:/workspace
      - ./data:/app/data
      - ${HOME:-/root}/.config/opencode:/opt/opencode-config:ro
      - ${HOME:-/root}/.ssh:/tmp/.ssh:ro
      - ${HOME:-/root}/ai_models:/workspace/ai_models:ro
      - ./secrets/${NODE_NAME:-node-a}-critic.nk:/secrets/${NODE_NAME:-node-a}-critic.nk:ro
    depends_on:
      nats:
        condition: service_healthy
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256

  telegram:
    <<: *mesh-service
    command: ["python", "-m", "memnc.telegram"]
    environment:
      <<: *mesh-env
      NODE_NAME: ${NODE_NAME:-node-a}-telegram
      NATS_NKEYS_SEED: /secrets/${NODE_NAME:-node-a}-telegram.nk
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOW: ${TELEGRAM_ALLOW:-}
      # Telegram user ids allowed to write (/submit, /cancel, /approve, buttons).
      # Empty = read-only bot.
      TELEGRAM_ALLOW_USERS: ${TELEGRAM_ALLOW_USERS:-}
      TELEGRAM_POLL_S: ${TELEGRAM_POLL_S:-25}
    volumes:
      # Read-only mirror: no workspace/data access, only its own NKey seed
      # (NATS_NKEYS_SEED=/secrets/<node>-telegram.nk).
      - ./secrets/${NODE_NAME:-node-a}-telegram.nk:/secrets/${NODE_NAME:-node-a}-telegram.nk:ro
    depends_on:
      nats:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

volumes:
  nats-data:
