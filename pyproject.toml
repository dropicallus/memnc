[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memnc"
version = "0.1.0"
description = "Lightweight distributed multi-agent mesh over NATS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "nats-py>=2.9",
  "mcp>=2",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
  "pytest-asyncio>=0.24",
]

[project.scripts]
meshctl = "memnc.cli:main"
memnc-telegram = "memnc.telegram:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires a running NATS server (skipped when unavailable)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["training", "workspace"]

[tool.ruff.lint]
select = [
  "E4", "E7", "E9", "F",   # pyflakes + core errors
  "I",                     # import sorting
  "UP",                    # pyupgrade
  "B",                     # bugbear
]
ignore = [
  "S110",  # try-except-pass: intentional in observers/bus handlers
  "BLE001",# blind except: intentional at mesh boundaries
  "S112",  # try-except-continue: same
]
